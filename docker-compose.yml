services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: budget_manager
      POSTGRES_USER: budget_manager
      POSTGRES_PASSWORD: budget_manager
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget_manager -d budget_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: